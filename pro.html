<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MSD ALPHA ALONE - Pro Crypto Risk & API Terminal</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        body { background-color: #0b0e11; color: #f0b90b; padding: 12px; }
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border-bottom: 1px solid #22252a; padding-bottom: 10px; }
        header h1 { font-size: 1.1rem; color: #f0b90b; letter-spacing: 0.5px; }
        .shield-status { background: #1e2329; padding: 4px 10px; border-radius: 4px; font-size: 0.75rem; color: #0ecb81; border: 1px solid #0ecb81; }
        .card { background: #1e2329; border-radius: 10px; padding: 12px; margin-bottom: 12px; border: 1px solid #2b3139; }
        .card h3 { font-size: 0.85rem; color: #fff; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
        .input-group { margin-bottom: 10px; }
        .input-group label { display: block; font-size: 0.75rem; color: #848e9c; margin-bottom: 3px; text-transform: uppercase; }
        .input-group input, .input-group select { width: 100%; background: #0b0e11; border: 1px solid #2b3139; color: #fff; padding: 10px; border-radius: 6px; font-size: 14px; font-weight: 700; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
        .stat-box { background: #0b0e11; padding: 10px; border-radius: 6px; border: 1px solid #2b3139; }
        .stat-box span { display: block; font-size: 10px; color: #848e9c; }
        .stat-box strong { font-size: 14px; color: #0ecb81; }
        .btn { width: 100%; background: #f0b90b; color: #0b0e11; border: none; padding: 12px; border-radius: 6px; font-size: 14px; font-weight: 800; cursor: pointer; margin-top: 5px; }
        .nav-tabs { display: flex; justify-content: space-around; background: #1e2329; position: fixed; bottom: 0; left: 0; width: 100%; padding: 10px 0; border-top: 1px solid #2b3139; }
        .nav-tab { color: #848e9c; font-size: 11px; text-align: center; text-decoration: none; font-weight: 700; }
        .nav-tab.active { color: #f0b90b; }
        .live-price-tag { color: #0ecb81; font-weight: bold; }
    </style>
</head>
<body>

    <header>
        <h1>MSD ALPHA PRO</h1>
        <div class="shield-status">🛡️ API LIVE</div>
    </header>

    <!-- Exchange & API Selector -->
    <div class="card">
        <h3>Live Market Connector</h3>
        <div class="grid-2">
            <div class="input-group">
                <label>Exchange</label>
                <select id="exchangeSelect" onchange="updateSymbol()">
                    <option value="binance">Binance Futures</option>
                    <option value="bybit">Bybit Derivatives</option>
                </select>
            </div>
            <div class="input-group">
                <label>Symbol</label>
                <select id="symbolSelect" onchange="fetchLivePrice()">
                    <option value="BTCUSDT">BTC/USDT</option>
                    <option value="ETHUSDT">ETH/USDT</option>
                    <option value="SOLUSDT">SOL/USDT</option>
                </select>
            </div>
        </div>
        <div style="margin-top: 8px; font-size: 12px; display: flex; justify-content: space-between;">
            <span>Real-time Price:</span>
            <span id="livePriceDisplay" class="live-price-tag">Loading...</span>
        </div>
    </div>

    <!-- Wallet Guard & Risk Calculator -->
    <div class="card">
        <h3>⚡ Daily Loss Guard & Risk Calculator</h3>
        <div class="input-group">
            <label>Wallet Balance (USDT)</label>
            <input type="number" id="walletBal" value="1000" oninput="calculateRisk()">
        </div>
        <div class="input-group">
            <label>Risk Per Trade (%)</label>
            <input type="number" id="riskPct" value="1" oninput="calculateRisk()">
        </div>
        <div class="grid-2">
            <div class="stat-box">
                <span>Max Allowable Loss</span>
                <strong id="maxLoss" style="color: #f6465d;">$10.00</strong>
            </div>
            <div class="stat-box">
                <span>Safe Max Leverage</span>
                <strong id="safeLev">20x</strong>
            </div>
        </div>
    </div>

    <!-- Entry & SL Setup -->
    <div class="card">
        <h3>🎯 Entry & Stop Loss Setup</h3>
        <div class="grid-2">
            <div class="input-group">
                <label>Entry Price ($)</label>
                <input type="number" id="entryPrice" value="80000" oninput="calculateRisk()">
            </div>
            <div class="input-group">
                <label>Stop Loss Price ($)</label>
                <input type="number" id="slPrice" value="79000" oninput="calculateRisk()">
            </div>
        </div>
        <div class="grid-2" style="margin-top: 10px;">
            <div class="stat-box">
                <span>Position Size</span>
                <strong id="posSize">0.00</strong>
            </div>
            <div class="stat-box">
                <span>Target Reward (TP)</span>
                <strong id="targetReward">$35.00</strong>
            </div>
        </div>
        <button class="btn" onclick="lockShield()">LOCK SETUP & DEPLOY SHIELD</button>
    </div>

    <!-- Bottom Navigation -->
    <div class="nav-tabs">
        <a href="#" class="nav-tab active">Home</a>
        <a href="#" class="nav-tab">Markets</a>
        <a href="#" class="nav-tab">Futures</a>
        <a href="#" class="nav-tab">Guard</a>
    </div>

    <script>
        // Fetch Live Price from Binance / Bybit Public API
        async function fetchLivePrice() {
            const exchange = document.getElementById('exchangeSelect').value;
            const symbol = document.getElementById('symbolSelect').value;
            let price = 0;

            try {
                if (exchange === 'binance') {
                    let res = await fetch(`https://api.binance.com/api/v3/ticker/price?symbol=${symbol}`);
                    let data = await res.json();
                    price = parseFloat(data.price);
                } else if (exchange === 'bybit') {
                    let res = await fetch(`https://api.bybit.com/v5/market/tickers?category=linear&symbol=${symbol}`);
                    let data = await res.json();
                    price = parseFloat(data.result.list[0].lastPrice);
                }

                document.getElementById('livePriceDisplay').innerText = "$" + price.toLocaleString();
                document.getElementById('entryPrice').value = price;
            } catch (e) {
                document.getElementById('livePriceDisplay').innerText = "API Error";
            }
        }

        function calculateRisk() {
            let bal = parseFloat(document.getElementById('walletBal').value) || 0;
            let risk = parseFloat(document.getElementById('riskPct').value) || 0;
            let entry = parseFloat(document.getElementById('entryPrice').value) || 0;
            let sl = parseFloat(document.getElementById('slPrice').value) || 0;

            let maxLoss = (bal * risk) / 100;
            document.getElementById('maxLoss').innerText = "$" + maxLoss.toFixed(2);

            let slDiff = Math.abs(entry - sl);
            let posSize = slDiff > 0 ? (maxLoss / slDiff) : 0;
            document.getElementById('posSize').innerText = posSize.toFixed(4);

            let targetReward = maxLoss * 2.5;
            document.getElementById('targetReward').innerText = "$" + targetReward.toFixed(2);
        }

        function lockShield() {
            alert("🛡️ MSD Alpha Shield Activated! Risk limits locked successfully.");
        }

        // Auto fetch price every 5 seconds
        fetchLivePrice();
        setInterval(fetchLivePrice, 5000);
    </script>
</body>
          </html>
