<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MSD ALPHA ALONE - Wallet Shield & Profit Optimizer</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #0b0e11; color: #f0b90b; padding: 15px; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid #22252a; padding-bottom: 10px; }
        .header h1 { font-size: 1.2rem; color: #f0b90b; letter-spacing: 1px; }
        .shield-status { background: #1e2329; padding: 6px 12px; border-radius: 6px; font-size: 0.8rem; color: #0ecb81; border: 1px solid #0ecb8133; }
        .card { background: #1e2329; border-radius: 12px; padding: 15px; margin-bottom: 15px; border: 1px solid #2b313a; }
        .card h3 { font-size: 0.95rem; color: #fff; margin-bottom: 12px; display: flex; justify-content: space-between; }
        .input-group { margin-bottom: 12px; }
        .input-group label { display: block; font-size: 0.75rem; color: #848e9c; margin-bottom: 5px; text-transform: uppercase; }
        .input-group input { width: 100%; background: #0b0e11; border: 1px solid #2b313a; color: #fff; padding: 10px; border-radius: 6px; font-size: 0.95rem; }
        .input-group input:focus { border-color: #f0b90b; outline: none; }
        .metrics-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px; }
        .metric-box { background: #0b0e11; padding: 10px; border-radius: 8px; border: 1px solid #2b313a; }
        .metric-title { font-size: 0.7rem; color: #848e9c; }
        .metric-value { font-size: 1.1rem; color: #fff; font-weight: bold; margin-top: 4px; }
        .metric-value.safe { color: #0ecb81; }
        .metric-value.danger { color: #f6465d; }
        .btn { width: 100%; background: #f0b90b; color: #000; border: none; padding: 12px; border-radius: 8px; font-weight: bold; font-size: 1rem; cursor: pointer; margin-top: 5px; }
        .chart-container { position: relative; height: 200px; width: 100%; margin-top: 10px; }
    </style>
</head>
<body>

    <div class="header">
        <h1>MSD ALPHA ALONE</h1>
        <div class="shield-status" id="shieldBadge">🛡️ SHIELD: ACTIVE</div>
    </div>

    <div class="card">
        <h3><span>⚡ Wallet Shield & Risk Calculator</span></h3>
        <div class="input-group">
            <label>Wallet Balance (USDT)</label>
            <input type="number" id="walletBal" value="1000" oninput="calculateRisk()">
        </div>
        <div class="input-group">
            <label>Risk Per Trade (%)</label>
            <input type="number" id="riskPct" value="1" step="0.1" oninput="calculateRisk()">
        </div>
        <div class="metrics-grid">
            <div class="metric-box">
                <div class="metric-title">Max Allowable Loss</div>
                <div class="metric-value danger" id="maxLoss">$10.00</div>
            </div>
            <div class="metric-box">
                <div class="metric-title">Safe Max Leverage</div>
                <div class="metric-value safe" id="safeLev">10x</div>
            </div>
        </div>
    </div>

    <div class="card">
        <h3><span>🎯 Entry & Stop Loss Setup</span></h3>
        <div class="input-group">
            <label>Entry Price ($)</label>
            <input type="number" id="entryPrice" value="80642" oninput="calculateRisk()">
        </div>
        <div class="input-group">
            <label>Stop Loss Price ($)</label>
            <input type="number" id="slPrice" value="80992" oninput="calculateRisk()">
        </div>
        <div class="metrics-grid">
            <div class="metric-box">
                <div class="metric-title">Position Size</div>
                <div class="metric-value" id="posSize">0.28 BTC</div>
            </div>
            <div class="metric-box">
                <div class="metric-title">Target Reward (TP)</div>
                <div class="metric-value safe" id="tpTarget">$42.00</div>
            </div>
        </div>
        <button class="btn" onclick="executeShieldAlert()">LOCK SETUP & DEPLOY SHIELD</button>
    </div>

    <div class="card">
        <h3><span>📊 Live Shield Monitor</span></h3>
        <div class="chart-container">
            <canvas id="marketChart"></canvas>
        </div>
    </div>

    <script>
        let chart;
        function initChart() {
            const ctx = document.getElementById('marketChart').getContext('2d');
            chart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: ['1m', '2m', '3m', '4m', '5m', 'Live'],
                    datasets: [{
                        label: 'BTC Price',
                        data: [80400, 80500, 80450, 80600, 80580, 80642],
                        borderColor: '#f0b90b',
                        borderWidth: 2,
                        pointRadius: 0,
                        tension: 0.2
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        x: { grid: { color: '#22252a' }, ticks: { color: '#848e9c' } },
                        y: { grid: { color: '#22252a' }, ticks: { color: '#848e9c' } }
                    }
                }
            });
        }

        function calculateRisk() {
            let bal = parseFloat(document.getElementById('walletBal').value) || 0;
            let riskP = parseFloat(document.getElementById('riskPct').value) || 0;
            let entry = parseFloat(document.getElementById('entryPrice').value) || 0;
            let sl = parseFloat(document.getElementById('slPrice').value) || 0;

            let maxLossVal = bal * (riskP / 100);
            document.getElementById('maxLoss').innerText = '$' + maxLossVal.toFixed(2);

            let slDistPct = Math.abs((entry - sl) / entry) * 100;
            let calculatedLev = slDistPct > 0 ? Math.min(20, Math.max(2, Math.floor(15 / slDistPct))) : 10;
            document.getElementById('safeLev').innerText = calculatedLev + 'x';

            let riskAmountPerUnit = Math.abs(entry - sl);
            let posMargin = riskAmountPerUnit > 0 ? (maxLossVal / (riskAmountPerUnit / entry)) : 0;
            let btcSize = entry > 0 ? (posMargin / entry) : 0;
            document.getElementById('posSize').innerText = btcSize.toFixed(4 + ' BTC');

            let tp2Val = maxLossVal * 3.5;
            document.getElementById('tpTarget').innerText = '$' + tp2Val.toFixed(2);
        }

        function executeShieldAlert() {
            alert('🛡️ MSD ALPHA SHIELD ENGAGED! Risk locked and liquidation trap blocked successfully.');
        }

        window.onload = function() {
            initChart();
            calculateRisk();
        };
    </script>
</body>
</html>
